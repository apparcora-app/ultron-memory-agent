name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run Ruff (lint + format check)
        run: ruff check . --output-format=github

      - name: Run Mypy (type check)
        run: mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true  # advisory until type annotations are complete

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Create test .env
        run: cp .env.example .env

      - name: Run tests
        run: |
          pytest tests/ -v \
            --ignore=tests/fixtures \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            -q
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ultron-memory-agent:ci .

      - name: Verify container starts
        run: |
          docker run --rm \
            -e LLM_PROVIDER=gemini \
            -e GEMINI_API_KEY=test \
            ultron-memory-agent:ci python -c "print('Container OK')"
