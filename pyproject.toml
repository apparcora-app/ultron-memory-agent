[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-memory-agent"
version = "1.0.0"
description = "Autonomous AI Agent with persistent long-term memory, multi-provider LLM orchestration, and vector stores"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Hanzla Rehman", email = "reach.hanzla@gmail.com"}
]
keywords = [
    "ai-agent",
    "memory",
    "mem0",
    "langgraph",
    "crewai",
    "qdrant",
    "chromadb",
    "tree-of-thoughts",
    "fastapi"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "verify_*.py"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "data",
    "browser-use",
    "skills",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
