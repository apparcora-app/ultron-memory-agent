name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret Leak Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy

      - name: Run Ruff (Strict Enforcement)
        run: ruff check core memory reasoning security governance --output-format=github

      - name: Run Mypy (Strict Type Verification)
        run: mypy security/environment.py core/profiles.py memory/qdrant_store.py memory/embeddings.py --ignore-missing-imports

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . --no-deps
          pip install pytest pytest-asyncio pytest-cov fastembed qdrant-client pyyaml

      - name: Create test .env
        run: cp .env.example .env

      - name: Run Verified Test Suite
        run: |
          pytest tests/test_subprocess_sanitizer.py tests/test_qdrant_store.py tests/test_profile_engine.py tests/test_isolation.py -v --tb=short
        env:
          APPROVAL_MODE: "off"
          ULTRON_PROFILE: "default"
          VECTOR_STORE_PROVIDER: "qdrant"

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ultron-memory-agent:ci .

      - name: Verify container starts
        run: |
          docker run --rm \
            -e LLM_PROVIDER=gemini \
            -e GEMINI_API_KEY=test \
            ultron-memory-agent:ci python -c "print('Container OK')"
