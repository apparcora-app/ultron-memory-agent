[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-memory-agent"
version = "1.3.0"
description = "Enterprise-grade autonomous AI cognitive system with persistent long-term memory, multi-model routing, multi-agent swarm orchestration, and governance guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [
    {name = "Ultron Maintainers", email = "maintainer@example.com"}
]
keywords = [
    "autonomous-agent",
    "ai-agent",
    "memory",
    "mem0",
    "langgraph",
    "crewai",
    "qdrant",
    "chromadb",
    "tree-of-thoughts",
    "fastapi",
    "llm",
    "multi-agent"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/apparcora-app/ultron-memory-agent"
Repository = "https://github.com/apparcora-app/ultron-memory-agent"
"Bug Tracker" = "https://github.com/apparcora-app/ultron-memory-agent/issues"
Changelog = "https://github.com/apparcora-app/ultron-memory-agent/blob/main/CHANGELOG.md"
Security = "https://github.com/apparcora-app/ultron-memory-agent/blob/main/SECURITY.md"

dependencies = [
    "mem0ai==0.1.101",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.3.0",
    "openai>=1.55.0,<2.0.0",
    "anthropic>=0.40.0,<0.45.0",
    "google-genai>=0.1.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",
    "crewai>=0.80.0",
    "pydantic>=2.7.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "python-multipart>=0.0.6",
    "websockets>=12.0",
    "requests>=2.32.0",
    "aiohttp>=3.9.0",
    "curl-cffi>=0.7.0",
    "duckduckgo-search>=7.0.0",
    "mcp>=1.0.0",
    "langfuse>=2.50.0",
    "unstructured[all-docs]>=0.12.0",
    "deepeval>=1.0.0",
    "discord.py>=2.3.0",
    "rich>=13.9.0",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "tabulate>=0.9.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",
    "numpy>=1.26.0",
    "prometheus-client>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
ultron     = "main:main"
ultron-web = "app:main"

[tool.pytest.ini_options]
testpaths    = ["tests"]
norecursedirs = ["tests/manual"]
python_files = ["test_*.py", "verify_*.py"]
asyncio_mode = "auto"
addopts      = "-v --tb=short -m \"not llm_live\""
markers = [
    "llm_live: tests requiring live LLM access (DeepEval / external APIs)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.ruff]
line-length    = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    "venv",
    "data",
    "browser-use",
    "tax_modules/variants",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501", "B008", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]

[tool.mypy]
python_version             = "3.11"
ignore_missing_imports     = true
disallow_untyped_defs      = false
warn_return_any            = false
warn_unused_ignores        = true
no_implicit_optional       = true
strict_optional            = true

